name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  machine-independent:
    # Everything here runs without Ableton Live and without anyone's own
    # projects. The rest of the suite (scripts/check_all.sh) needs a real
    # Ableton install and cannot run on a hosted runner.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audio libraries for the Mix Check and crate suites (Python 3.11+)
        if: matrix.python != '3.9'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1; fi
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest "numpy>=1.26" "scipy>=1.11" "librosa>=0.10.2" "soundfile>=0.12" "pyloudnorm>=0.1.1" "pydantic>=2"

      - name: Suites that need neither Live nor personal data
        run: ./scripts/check_ci.sh

  extension-typecheck:
    # A real `tsc --noEmit` over the extension. The Ableton Extensions SDK is
    # not redistributable, so it cannot be installed on a hosted runner; when
    # it is absent the job reports SKIPPED and fails on purpose under
    # continue-on-error, so it is never shown as a passing typecheck.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck the extension, or report that the SDK is unavailable
        working-directory: extension
        run: |
          if [ -f vendor/ableton-extensions-sdk-1.0.0-beta.1.tgz ]; then
            npm ci
            npx tsc --noEmit
            npx tsx tests/bridge.test.ts
            echo "extension typecheck + bridge tests: PASSED"
          else
            echo "::warning title=extension-typecheck skipped::The Ableton Extensions SDK tarball is not in the repository (not redistributable). Run 'npm run build' locally; this job is SKIPPED, not passed."
            echo "extension typecheck: SKIPPED (SDK unavailable on this runner)"
            exit 1
          fi
