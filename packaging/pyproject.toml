[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subverselab-loom"
version = "0.4.4"
description = "Loom — measurement-based production for Ableton Live: a local MCP server that reads your own projects and library and writes into a running Live session."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Şenol Şahan", email = "info@subverselab.com" }]
keywords = ["mcp", "ableton", "ableton-live", "music-production", "midi", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]

# The MCP protocol is spoken directly over stdio JSON-RPC, so there is no SDK
# dependency here and nothing compiled that pip cannot resolve on its own.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10.1",
  "mido>=1.3",
]

[project.urls]
Homepage = "https://subverselab.com/loom"
Repository = "https://github.com/senolsahan037-oss/loom"

[project.scripts]
loom-mcp = "subverselab_loom.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["subverselab_loom*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.md", "*.txt", "*.plist", "*.swift"]
